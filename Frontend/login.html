<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | LiwaTrack</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="auth-page">


<div class="auth-container">


    <div class="auth-brand">

        <a href="index.html" class="logo">

            <div class="logo-mark">
                LA
            </div>

            <span>
                Liwa<span>Track</span>
            </span>

        </a>

    </div>


    <div class="auth-card">


        <div class="auth-header">

            <h1>
                Welcome back
            </h1>

            <p>
                Sign in to manage your achievements.
            </p>

        </div>


        <form id="loginForm">


            <label>
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="student@lu.ac.ae"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="••••••••"
                required
            >


            <div class="form-row-between">

                <label class="checkbox-label">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>


                <a
                    href="#"
                    onclick="forgotPassword(event)"
                >
                    Forgot password?
                </a>

            </div>


            <button
                class="btn btn-primary full-width"
                type="submit"
            >
                Sign In
            </button>


        </form>


        <div class="auth-divider">

            <span>
                or
            </span>

        </div>


        <p class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </p>


    </div>


</div>


<script src="js/data.js"></script>
<script src="js/app.js"></script>


<script>



document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            const button =
                document.querySelector(
                    "#loginForm button[type='submit']"
                );


            button.disabled = true;

            button.textContent = "Signing in...";


            try {

                const response =
                    await fetch(
                        `${API_URL}/auth/login`,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                password: password

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Login failed."
                    );

                }


                // =========================================
                // SAVE SESSION TOKEN
                // =========================================

                localStorage.setItem(
                    "liwa_session_token",
                    data.session_token
                );


                // =========================================
                // SAVE LOGGED-IN USER
                // =========================================

                localStorage.setItem(
                    "liwa_user",
                    JSON.stringify({

                        id: data.user_id,

                        name: data.name,

                        email: data.email,

                        university_id:
                            data.university_id

                    })
                );


                // =========================================
                // REMOVE OLD FAKE LOGIN STATE
                // =========================================

                localStorage.removeItem(
                    "liwa_logged_in"
                );


                // =========================================
                // GO TO DASHBOARD
                // =========================================

                window.location.href =
                    "dashboard.html";


            } catch (error) {

                alert(
                    error.message
                );


                button.disabled = false;

                button.textContent =
                    "Sign In";

            }

        }
    );


function forgotPassword(e) {

    e.preventDefault();


    alert(
        "Password reset functionality will be connected to the backend later."
    );

}

</script>


</body>

</html>
