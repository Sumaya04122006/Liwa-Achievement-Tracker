<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Settings | LiwaTrack</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<div id="app"></div>


<script src="js/data.js"></script>
<script src="js/app.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        if (!requireLogin()) {
            return;
        }


        renderLayout(`

            <main class="main-content">


                <div class="page-header">

                    <div>

                        <h1>
                            Settings
                        </h1>

                        <p>
                            Manage your account and preferences.
                        </p>

                    </div>

                </div>


                <div class="settings-grid">


                    <!-- ==========================
                         NOTIFICATIONS
                    =========================== -->

                    <section class="content-card">

                        <h2>
                            Notifications
                        </h2>


                        <label class="setting-row">

                            <div>

                                <strong>
                                    Achievement reminders
                                </strong>

                                <p>
                                    Receive reminders to update your profile.
                                </p>

                            </div>


                            <input
                                type="checkbox"
                                checked
                            >

                        </label>


                        <label class="setting-row">

                            <div>

                                <strong>
                                    Portfolio updates
                                </strong>

                                <p>
                                    Notify me when my portfolio changes.
                                </p>

                            </div>


                            <input
                                type="checkbox"
                                checked
                            >

                        </label>

                    </section>


                    <!-- ==========================
                         PORTFOLIO VISIBILITY
                    =========================== -->

                    <section class="content-card">

                        <h2>
                            Portfolio visibility
                        </h2>


                        <label class="setting-row">

                            <div>

                                <strong>
                                    Public portfolio
                                </strong>

                                <p>
                                    Allow others to view your portfolio.
                                </p>

                            </div>


                            <input
                                type="checkbox"
                                checked
                            >

                        </label>

                    </section>


                    <!-- ==========================
                         ACCOUNT
                    =========================== -->

                    <section class="content-card">

                        <h2>
                            Account
                        </h2>


                        <p class="muted">
                            Manage your LiwaTrack session.
                        </p>


                        <button
                            class="btn btn-secondary"
                            onclick="handleLogout()"
                            style="margin-top:15px;"
                        >

                            Log Out

                        </button>

                    </section>


                </div>


            </main>

        `);

    }
);


// ==========================================
// LOGOUT
// ==========================================

function handleLogout() {

    const confirmed =
        confirm(
            "Are you sure you want to log out?"
        );


    if (!confirmed) {
        return;
    }


    logout();

}

</script>


</body>

</html>
